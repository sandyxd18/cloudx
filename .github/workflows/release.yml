name: release

# Pushing a tag like v0.7.0 runs the tests, builds the release tarball and the .deb packages, and publishes a GitHub
# release with all of them plus SHA256SUMS. There is no apt repository: the release assets are the distribution channel.
# The release body is docs/releases/<tag>.md; a pre-release such as v1.0.0-rc1 uses the notes of the release it leads
# to (docs/releases/v1.0.0.md) and is marked as a pre-release on GitHub. Without either file the notes are generated.
#
# Running the workflow by hand (Actions > release > Run workflow, or `gh workflow run release.yml`) is a dry run:
# the same tests, tarball, packages, package checks and checksums, but nothing is published; the files are attached
# to the run as the artifact "release-dry-run".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        if: github.ref_type == 'tag'
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check services cli tests --select F401,F811,F821,F841 --exclude "node_modules,migrations/versions"
      - run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/dashboard/frontend/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
        working-directory: services/dashboard/frontend

      - name: Build release tarball
        run: ./scripts/build-tarball.sh

      - name: Build .deb packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          ./scripts/build-deb.sh

      - name: Checksums
        run: |
          mkdir -p dist/release
          cp dist/deb/*.deb dist/cloudx-[0-9]*.tar.gz dist/release/
          cd dist/release
          # a pre-release package is cloudx-x_1.0.0~rc1-1_amd64.deb; GitHub rewrites "~" in asset names, which would make
          # SHA256SUMS name files that do not exist. apt reads the version from the package, not from the file name.
          for f in *~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done || true
          sha256sum -- *.deb *.tar.gz > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Release notes
        id: notes
        run: |
          for f in "docs/releases/${GITHUB_REF_NAME}.md" "docs/releases/${GITHUB_REF_NAME%%-*}.md"; do
            if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; break; fi
          done

      - name: Keep the files of a dry run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/release/*.deb
            dist/release/cloudx-[0-9]*.tar.gz
            dist/release/SHA256SUMS
            ${{ steps.notes.outputs.file }}
          retention-days: 7

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: CloudX ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.file == '' }}
          fail_on_unmatched_files: true
          files: |
            dist/release/*.deb
            dist/release/cloudx-[0-9]*.tar.gz
            dist/release/SHA256SUMS
