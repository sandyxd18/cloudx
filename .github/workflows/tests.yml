name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (undefined names, unused and redefined imports)
        run: ruff check services cli tests --select F401,F811,F821,F841 --exclude "node_modules,migrations/versions"
      # Unit tests only: tests/live needs a running CloudX lab and is skipped without --live.
      - run: pytest -q
