# ═══════════════════════════════════════════════════════════════════════════════
# CloudX — Multi-Node Deployment: CONTROL PLANE (Controller Node)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Runs the stateful backends (PostgreSQL, RabbitMQ, OVN NB/SB DB + northd) and
# all stateless API services + dashboard + HAProxy/Keepalived.
#
# The Compute Nodes and Storage Nodes connect back to THIS node over the
# management network (NETWORK_INTERFACE). Point them at this node's IP via:
#   CONTROLLER_IP=<controller management ip>
#
# Usage on the controller host:
#   docker compose -f docker-compose.control-plane.yml up -d
#
# For a SINGLE-NODE all-in-one lab, use the default docker-compose.yml instead —
# it already bundles workers + storage + gateway on one host.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_openstack}
      POSTGRES_USER: ${POSTGRES_USER:-mini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini} -d ${POSTGRES_DB:-mini_openstack}"]
      interval: 5s
      timeout: 5s
      retries: 20

  memcached:
    image: memcached:1.6-alpine
    network_mode: host

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cloudx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-cloudx}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ── OVN Northbound / Southbound DB + northd (centralized on controller) ───────
  # Both DBs already bind on 0.0.0.0 so remote ovn-controllers on compute/gateway
  # nodes can reach the SB DB at tcp:<CONTROLLER_IP>:6642.
  ovn-nb-db:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-ovn-db.sh", "nb"]
    network_mode: host
    volumes:
      - ovn-nb-data:/var/lib/ovn

  ovn-sb-db:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-ovn-db.sh", "sb"]
    network_mode: host
    volumes:
      - ovn-sb-data:/var/lib/ovn

  ovn-northd:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-northd.sh"]
    depends_on:
      - ovn-nb-db
      - ovn-sb-db
    environment:
      OVN_NB_DB: tcp:127.0.0.1:6641
      OVN_SB_DB: tcp:127.0.0.1:6642
    network_mode: host

  auth-api:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8005
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      AUTH_TOKEN_EXPIRE_HOURS: ${AUTH_TOKEN_EXPIRE_HOURS:-24}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@cloudx.local}
      AUTH_ADMIN_PROJECT: ${AUTH_ADMIN_PROJECT:-admin}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy

  networking-api:
    build:
      context: ./services
      dockerfile: networking/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      OVN_NB_DB: tcp:127.0.0.1:6641
      PROVIDER_INTERFACE: ${PROVIDER_INTERFACE:-enp0s8}
      INTERNAL_VIP_ADDRESS: ${INTERNAL_VIP_ADDRESS:-}
      DEFAULT_SECURITY_GROUP_ALLOW_SSH: ${DEFAULT_SECURITY_GROUP_ALLOW_SSH:-true}
      DEFAULT_SECURITY_GROUP_ALLOW_ICMP: ${DEFAULT_SECURITY_GROUP_ALLOW_ICMP:-true}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    volumes:
      - /var/run/openvswitch:/var/run/openvswitch
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
      ovn-nb-db:
        condition: service_started

  image-api:
    build:
      context: ./services
      dockerfile: image/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8002
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      # Multi-node: image blobs live on the Storage Node's MinIO
      IMAGE_STORAGE_BACKEND: ${IMAGE_STORAGE_BACKEND:-minio}
      IMAGE_STORE_PATH: ${IMAGE_STORE_PATH:-/var/lib/mini-openstack/images}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-openstack-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    volumes:
      - image-data:/var/lib/mini-openstack/images
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  metadata-api:
    build:
      context: ./services
      dockerfile: metadata/Dockerfile
      network: host
    environment:
      COMPUTE_API_URL: http://127.0.0.1:8003
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      compute-api:
        condition: service_started

  metadata-proxy:
    build:
      context: ./services
      dockerfile: metadata_proxy/Dockerfile
      network: host
    environment:
      METADATA_API_URL: ${METADATA_API_URL:-http://127.0.0.1:8775}
      NETWORKING_API_URL: ${NETWORKING_API_URL:-http://127.0.0.1:8001}
      METADATA_PROXY_PORT: ${METADATA_PROXY_PORT:-8776}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      metadata-api:
        condition: service_started
      networking-api:
        condition: service_started

  compute-api:
    build:
      context: ./services
      dockerfile: compute/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8003
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      IMAGE_API_URL: http://127.0.0.1:8002
      NETWORKING_API_URL: http://127.0.0.1:8001
      BLOCK_STORE_API_URL: http://127.0.0.1:8004
      PLACEMENT_API_URL: http://127.0.0.1:8006
      NOVNC_BASE_URL: ${NOVNC_BASE_URL:-http://localhost:6080/vnc.html}
      COMPUTE_BACKEND: ${COMPUTE_BACKEND:-libvirt}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      RPC_CALL_TIMEOUT: ${RPC_CALL_TIMEOUT:-30}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-api:
        condition: service_started
      image-api:
        condition: service_started
      networking-api:
        condition: service_started
      block-store-api:
        condition: service_started

  conductor:
    build:
      context: ./services
      dockerfile: conductor/Dockerfile
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  block-store-api:
    build:
      context: ./services
      dockerfile: block_store/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8004
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      COMPUTE_API_URL: http://127.0.0.1:8003
      IMAGE_API_URL: http://127.0.0.1:8002
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      RPC_CALL_TIMEOUT: ${RPC_CALL_TIMEOUT:-30}
      STORAGE_LVM_DRIVER: ${STORAGE_LVM_DRIVER:-true}
      STORAGE_CEPH_RBD_DRIVER: ${STORAGE_CEPH_RBD_DRIVER:-false}
      LVM_VG_NAME: ${LVM_VG_NAME:-vg-cloudx}
      CEPH_POOL: ${CEPH_POOL:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-cloudx-backups}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-api:
        condition: service_started
      image-api:
        condition: service_started

  placement-api:
    build:
      context: ./services
      dockerfile: placement/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8006
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  dashboard:
    build:
      context: ./services
      dockerfile: dashboard/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      AUTH_API_URL: http://127.0.0.1:8005
      COMPUTE_API_URL: http://127.0.0.1:8003
      NETWORKING_API_URL: http://127.0.0.1:8001
      IMAGE_API_URL: http://127.0.0.1:8002
      BLOCK_STORE_API_URL: http://127.0.0.1:8004
      PLACEMENT_API_URL: http://127.0.0.1:8006
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      MEMCACHED_URL: 127.0.0.1:11211
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    depends_on:
      auth-api:
        condition: service_started
      compute-api:
        condition: service_started
      networking-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_started

  novnc-proxy:
    image: python:3.12-slim
    network_mode: host
    command: >
      bash -c "pip install websockify --quiet &&
      websockify 6080 127.0.0.1:5900"
    restart: unless-stopped

  image-worker:
    build:
      context: ./services
      dockerfile: image_worker/Dockerfile
      network: host
    environment:
      IMAGE_API_URL: http://127.0.0.1:8002
      IMAGE_STORE_PATH: ${IMAGE_STORE_PATH:-/var/lib/mini-openstack/images}
      IMAGE_STORAGE_BACKEND: ${IMAGE_STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-openstack-images}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    network_mode: host
    volumes:
      - image-data:/var/lib/mini-openstack/images
    depends_on:
      rabbitmq:
        condition: service_healthy
      image-api:
        condition: service_started

  haproxy:
    build:
      context: ./services/haproxy
      network: host
    network_mode: host
    environment:
      HAPROXY_STATS_PORT: ${HAPROXY_STATS_PORT:-8404}
      AUTH_PORT: 8005
      NETWORKING_PORT: 8001
      IMAGE_PORT: 8002
      COMPUTE_PORT: 8003
      BLOCK_STORE_PORT: 8004
      PLACEMENT_PORT: 8006
      DASHBOARD_PORT: 8080
      # Multi-node HA: comma-separated backend IPs for round-robin.
      # Defaults to loopback (single controller) when unset.
      AUTH_BACKENDS: ${AUTH_BACKENDS:-127.0.0.1}
      NETWORKING_BACKENDS: ${NETWORKING_BACKENDS:-127.0.0.1}
      IMAGE_BACKENDS: ${IMAGE_BACKENDS:-127.0.0.1}
      COMPUTE_BACKENDS: ${COMPUTE_BACKENDS:-127.0.0.1}
      BLOCK_STORE_BACKENDS: ${BLOCK_STORE_BACKENDS:-127.0.0.1}
      PLACEMENT_BACKENDS: ${PLACEMENT_BACKENDS:-127.0.0.1}
      DASHBOARD_BACKENDS: ${DASHBOARD_BACKENDS:-127.0.0.1}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    depends_on:
      auth-api:
        condition: service_started
      compute-api:
        condition: service_started
      networking-api:
        condition: service_started
      dashboard:
        condition: service_started

  keepalived:
    build:
      context: ./services/keepalived
      network: host
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-enp0s3}
      INTERNAL_VIP_ADDRESS: ${INTERNAL_VIP_ADDRESS:-}
      KEEPALIVED_STATE: ${KEEPALIVED_STATE:-MASTER}
      KEEPALIVED_PRIORITY: ${KEEPALIVED_PRIORITY:-100}
      KEEPALIVED_ROUTER_ID: ${KEEPALIVED_ROUTER_ID:-51}
      KEEPALIVED_AUTH_PASS: ${KEEPALIVED_AUTH_PASS:-cloudx01}
      HAPROXY_STATS_PORT: ${HAPROXY_STATS_PORT:-8404}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    depends_on:
      - haproxy

volumes:
  postgres-data:
  ovn-nb-data:
  ovn-sb-data:
  image-data:
  rabbitmq-data:
