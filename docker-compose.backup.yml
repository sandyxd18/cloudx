# ═══════════════════════════════════════════════════════════════════════════════
# CloudX — Automated backups overlay (Fase 5)
# ═══════════════════════════════════════════════════════════════════════════════
# Adds a scheduled PostgreSQL backup runner that dumps to MinIO nightly at 23:00
# Asia/Jakarta (configurable via BACKUP_CRON / TIMEZONE).
#
#   docker compose \
#       -f docker-compose.control-plane.yml \
#       -f docker-compose.backup.yml \
#       up -d backup
#
# Volume backups are triggered on-demand through the block-store API
# (POST /volumes/{id}/backup) and handled by block-store-worker → MinIO.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  backup:
    build:
      context: ./services/backup
      network: host
    network_mode: host
    environment:
      TZ: ${TIMEZONE:-Asia/Jakarta}
      BACKUP_CRON: ${BACKUP_CRON:-0 23 * * *}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-cloudx-backups}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-12}
      POSTGRES_DB: ${POSTGRES_DB:-mini_openstack}
      POSTGRES_USER: ${POSTGRES_USER:-mini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini}
      PGHOST: ${PGHOST:-127.0.0.1}
      PGPORT: ${PGPORT:-5432}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    restart: unless-stopped
