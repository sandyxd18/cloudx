services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_openstack}
      POSTGRES_USER: ${POSTGRES_USER:-mini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini}
      POSTGRES_MULTIPLE_DATABASES: cloudx_billing,cloudx_events,cloudx_orchestration
    network_mode: host
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini} -d ${POSTGRES_DB:-mini_openstack}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Memcached (Session Cache) ────────────────────────────────────────────────
  memcached:
    image: memcached:1.6-alpine
    network_mode: host

  # ── RabbitMQ (AMQP Message Broker) ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cloudx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-cloudx}
    network_mode: host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  ovn-nb-db:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-ovn-db.sh", "nb"]
    network_mode: host
    volumes:
      - ovn-nb-data:/var/lib/ovn

  ovn-sb-db:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-ovn-db.sh", "sb"]
    network_mode: host
    volumes:
      - ovn-sb-data:/var/lib/ovn

  ovn-northd:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-northd.sh"]
    depends_on:
      - ovn-nb-db
      - ovn-sb-db
    environment:
      OVN_NB_DB: tcp:127.0.0.1:6641
      OVN_SB_DB: tcp:127.0.0.1:6642
    network_mode: host

  ovs-ovn-controller:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-controller.sh"]
    privileged: true
    network_mode: host
    depends_on:
      - ovn-sb-db
    environment:
      OVN_SB_DB: tcp:127.0.0.1:6642
      PROVIDER_BRIDGE: ${PROVIDER_BRIDGE:-br-ex}
      PROVIDER_PHYSNET: ${PROVIDER_PHYSNET:-physnet1}
      PROVIDER_INTERFACE: ${PROVIDER_INTERFACE:-enp0s8}
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-}
    volumes:
      - /var/run/openvswitch:/var/run/openvswitch

  # ── Auth API (Keystone-like) ────────────────────────────────────────────────
  auth-api:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8005
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      AUTH_TOKEN_EXPIRE_HOURS: ${AUTH_TOKEN_EXPIRE_HOURS:-24}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@cloudx.local}
      AUTH_ADMIN_PROJECT: ${AUTH_ADMIN_PROJECT:-admin}
      TELEMETRY_API_URL: http://127.0.0.1:8010
      BILLING_API_URL: http://127.0.0.1:8011
      EVENT_API_URL: http://127.0.0.1:8012
      ORCHESTRATION_API_URL: http://127.0.0.1:8013
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy

  networking-api:
    build:
      context: ./services
      dockerfile: networking/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8001
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      OVN_NB_DB: tcp:127.0.0.1:6641
      PROVIDER_INTERFACE: ${PROVIDER_INTERFACE:-enp0s8}
      INTERNAL_VIP_ADDRESS: ${INTERNAL_VIP_ADDRESS:-}
      PROVIDER_CIDR: ${PROVIDER_CIDR:-}
      PROVIDER_GATEWAY: ${PROVIDER_GATEWAY:-}
      PROVIDER_ALLOCATION_START: ${PROVIDER_ALLOCATION_START:-}
      PROVIDER_ALLOCATION_END: ${PROVIDER_ALLOCATION_END:-}
      DEFAULT_SECURITY_GROUP_ALLOW_SSH: ${DEFAULT_SECURITY_GROUP_ALLOW_SSH:-true}
      DEFAULT_SECURITY_GROUP_ALLOW_ICMP: ${DEFAULT_SECURITY_GROUP_ALLOW_ICMP:-true}
    network_mode: host
    volumes:
      - /var/run/openvswitch:/var/run/openvswitch
      - ./services/networking/app:/app/app
      - ./services/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
      ovn-nb-db:
        condition: service_started

  image-api:
    build:
      context: ./services
      dockerfile: image/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8002
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      IMAGE_STORAGE_BACKEND: ${IMAGE_STORAGE_BACKEND:-file}
      IMAGE_STORE_PATH: ${IMAGE_STORE_PATH:-/var/lib/mini-openstack/images}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-openstack-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
    network_mode: host
    volumes:
      - image-data:/var/lib/mini-openstack/images
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  metadata-api:
    build:
      context: ./services
      dockerfile: metadata/Dockerfile
      network: host
    environment:
      COMPUTE_API_URL: http://127.0.0.1:8003
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
    network_mode: host
    depends_on:
      compute-api:
        condition: service_started

  metadata-proxy:
    build:
      context: ./services
      dockerfile: metadata_proxy/Dockerfile
      network: host
    environment:
      METADATA_API_URL: ${METADATA_API_URL:-http://127.0.0.1:8775}
      NETWORKING_API_URL: ${NETWORKING_API_URL:-http://127.0.0.1:8001}
      METADATA_PROXY_PORT: ${METADATA_PROXY_PORT:-8776}
    network_mode: host
    depends_on:
      metadata-api:
        condition: service_started
      networking-api:
        condition: service_started

  minio:
    image: minio/minio:latest
    profiles:
      - minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    network_mode: host
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    profiles:
      - minio
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-openstack-images}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-cloudx-backups}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://127.0.0.1:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing local/"$$MINIO_BUCKET"
        mc mb --ignore-existing local/"$$BACKUP_BUCKET"
    network_mode: host

  compute-api:
    build:
      context: ./services
      dockerfile: compute/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8003
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      IMAGE_API_URL: http://127.0.0.1:8002
      NETWORKING_API_URL: http://127.0.0.1:8001
      BLOCK_STORE_API_URL: http://127.0.0.1:8004
      PLACEMENT_API_URL: http://127.0.0.1:8006
      OBJECT_STORE_API_URL: http://127.0.0.1:8007
      NOVNC_BASE_URL: ${NOVNC_BASE_URL:-http://localhost:6080/vnc.html}
      COMPUTE_BACKEND: ${COMPUTE_BACKEND:-libvirt}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      RPC_CALL_TIMEOUT: ${RPC_CALL_TIMEOUT:-30}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-api:
        condition: service_started
      image-api:
        condition: service_started
      networking-api:
        condition: service_started
      block-store-api:
        condition: service_started

  compute-worker:
    build:
      context: ./services
      dockerfile: compute_worker/Dockerfile
      network: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    network_mode: host       # REQUIRED: tap devices must be in host netns for libvirt
    environment:
      IMAGE_API_URL: ${IMAGE_API_URL:-http://127.0.0.1:8002}
      BLOCK_STORE_API_URL: ${BLOCK_STORE_API_URL:-http://127.0.0.1:8004}
      RABBITMQ_URL: amqp://cloudx:cloudx@127.0.0.1:5672/
      LIBVIRT_URI: ${LIBVIRT_URI:-qemu:///system}
      COMPUTE_INSTANCE_DIR: ${COMPUTE_INSTANCE_DIR:-/var/lib/mini-openstack/compute/instances}
      COMPUTE_IMAGE_CACHE_DIR: ${COMPUTE_IMAGE_CACHE_DIR:-/var/lib/mini-openstack/compute/cache/images}
      OVS_BRIDGE: ${OVS_BRIDGE:-br-int}
      VM_NAME_PREFIX: ${VM_NAME_PREFIX:-mini-os}
    volumes:
      - ${COMPUTE_INSTANCE_DIR:-/var/lib/mini-openstack/compute/instances}:/var/lib/mini-openstack/compute/instances
      - ${COMPUTE_CACHE_DIR:-/var/lib/mini-openstack/compute/cache}:/var/lib/mini-openstack/compute/cache
      - /dev:/dev                  # LVM: access block devices for volume attach
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
      - /var/run/openvswitch:/var/run/openvswitch
    depends_on:
      rabbitmq:
        condition: service_healthy
      image-api:
        condition: service_started
      networking-api:
        condition: service_started

  # ── Conductor (nova-conductor equivalent) ───────────────────────────────
  conductor:
    build:
      context: ./services
      dockerfile: conductor/Dockerfile
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  block-store-api:
    build:
      context: ./services
      dockerfile: block_store/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8004
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      COMPUTE_API_URL: http://127.0.0.1:8003
      IMAGE_API_URL: http://127.0.0.1:8002
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      RPC_CALL_TIMEOUT: ${RPC_CALL_TIMEOUT:-30}
      STORAGE_LVM_DRIVER: ${STORAGE_LVM_DRIVER:-true}
      STORAGE_CEPH_RBD_DRIVER: ${STORAGE_CEPH_RBD_DRIVER:-false}
      LVM_VG_NAME: ${LVM_VG_NAME:-vg-cloudx}
      CEPH_POOL: ${CEPH_POOL:-}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-api:
        condition: service_started
      image-api:
        condition: service_started

  # ── Object Store API (swift/s3 gateway) ─────────────────────────────────────
  object-store-api:
    build:
      context: ./services
      dockerfile: object_store/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8007
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      NETWORKING_API_URL: http://127.0.0.1:8001
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
    volumes:
      - object-store-data:/var/lib/mini-openstack/object-store
      - ./services/object_store/app:/app/app
      - ./services/shared:/app/shared

  # ── Block Storage Worker (cinder-volume equivalent) ─────────────────────────
  block-store-worker:
    build:
      context: ./services
      dockerfile: block_store_worker/Dockerfile
      network: host
    privileged: true               # Required for lvcreate / vgcreate / pvcreate
    network_mode: host
    environment:
      IMAGE_API_URL: http://127.0.0.1:8002
      RABBITMQ_URL: amqp://cloudx:cloudx@127.0.0.1:5672/
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_LVM_DRIVER: ${STORAGE_LVM_DRIVER:-true}
      STORAGE_CEPH_RBD_DRIVER: ${STORAGE_CEPH_RBD_DRIVER:-false}
      LVM_PV_NAME: ${LVM_PV_NAME:-}
      LVM_VG_NAME: ${LVM_VG_NAME:-vg-cloudx}
      CEPH_POOL: ${CEPH_POOL:-}
      CEPH_CONF: ${CEPH_CONF:-/etc/ceph/ceph.conf}
      CEPH_KEYRING: ${CEPH_KEYRING:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-cloudx-backups}
      TZ: ${TIMEZONE:-Asia/Jakarta}
    volumes:
      - /dev:/dev                  # LVM: access to block devices on host
      - /run/lvm:/run/lvm          # LVM: lock files
      - /run/udev:/run/udev        # LVM: udev socket for udevadm settle
      - /etc/ceph:/etc/ceph:ro     # Ceph: config + keyring (optional)
    depends_on:
      rabbitmq:
        condition: service_healthy
      image-api:
        condition: service_started

  # ── Placement API ───────────────────────────────────────────────────────────
  placement-api:
    build:
      context: ./services
      dockerfile: placement/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8006
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  # ── Load Balancer API (Octavia-like) ──────────────────────────────────────────
  load-balancer-api:
    build:
      context: ./services
      dockerfile: load_balancer/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8008
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      NETWORKING_API_URL: http://127.0.0.1:8001
      COMPUTE_API_URL: http://127.0.0.1:8003
    network_mode: host
    volumes:
      - ./services/load_balancer/app:/app/app
      - ./services/shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
      networking-api:
        condition: service_started
      compute-api:
        condition: service_started

  # ── Dashboard (React + FastAPI proxy) ───────────────────────────────────────
  dashboard:
    build:
      context: ./services
      dockerfile: dashboard/Dockerfile
      network: host
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      AUTH_API_URL: http://127.0.0.1:8005
      COMPUTE_API_URL: http://127.0.0.1:8003
      NETWORKING_API_URL: http://127.0.0.1:8001
      IMAGE_API_URL: http://127.0.0.1:8002
      BLOCK_STORE_API_URL: http://127.0.0.1:8004
      PLACEMENT_API_URL: http://127.0.0.1:8006
      OBJECT_STORE_API_URL: http://127.0.0.1:8007
      LOAD_BALANCER_API_URL: http://127.0.0.1:8008
      TELEMETRY_API_URL: http://127.0.0.1:8010
      BILLING_API_URL: http://127.0.0.1:8011
      EVENT_API_URL: http://127.0.0.1:8012
      ORCHESTRATION_API_URL: http://127.0.0.1:8013
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      MEMCACHED_URL: 127.0.0.1:11211
      XIDE_WORKSPACE_ROOT: /var/lib/xide-workspaces
    network_mode: host
    volumes:
      - xide-workspaces:/var/lib/xide-workspaces
      - ./services/dashboard/app:/app/app
      - ./services/dashboard/frontend/dist:/app/app/static
    depends_on:
      auth-api:
        condition: service_started
      compute-api:
        condition: service_started
      networking-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      memcached:
        condition: service_started

  # ── noVNC WebSocket Proxy ─────────────────────────────────────────────────────
  # websockify bridges browser WebSocket to libvirt TCP VNC ports.
  # Port 6080 is the standard OpenStack noVNC proxy port.
  novnc-proxy:
    image: python:3.12-slim
    network_mode: host
    command: >
      bash -c "pip install websockify --quiet &&
      websockify 6080 127.0.0.1:5900"
    restart: unless-stopped

  # ── Image Worker (Glance task-based import) ───────────────────────────────────
  image-worker:
    build:
      context: ./services
      dockerfile: image_worker/Dockerfile
      network: host
    environment:
      IMAGE_API_URL: http://127.0.0.1:8002
      IMAGE_STORE_PATH: ${IMAGE_STORE_PATH:-/var/lib/mini-openstack/images}
      IMAGE_STORAGE_BACKEND: ${IMAGE_STORAGE_BACKEND:-file}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-openstack-images}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://cloudx:cloudx@127.0.0.1:5672/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    network_mode: host
    volumes:
      - image-data:/var/lib/mini-openstack/images
    depends_on:
      rabbitmq:
        condition: service_healthy
      image-api:
        condition: service_started

  # ── HAProxy (Load Balancer / API Gateway) ─────────────────────────────────────
  # Listens on all interfaces (0.0.0.0) and proxies to local API services.
  # When Keepalived activates INTERNAL_VIP_ADDRESS on this node, traffic to VIP:port
  # is also handled by HAProxy.
  # Stats dashboard: http://<node-ip>:8404/stats
  haproxy:
    build:
      context: ./services/haproxy
      network: host
    network_mode: host
    environment:
      HAPROXY_STATS_PORT: ${HAPROXY_STATS_PORT:-8404}
      AUTH_PORT: 8005
      NETWORKING_PORT: 8001
      IMAGE_PORT: 8002
      COMPUTE_PORT: 8003
      BLOCK_STORE_PORT: 8004
      PLACEMENT_PORT: 8006
      OBJECT_STORE_PORT: 8007
      LOAD_BALANCER_PORT: 8008
      DASHBOARD_PORT: 8080
      TELEMETRY_PORT: 8010
      BILLING_PORT: 8011
      EVENT_PORT: 8012
      ORCHESTRATION_PORT: 8013
    depends_on:
      auth-api:
        condition: service_started
      compute-api:
        condition: service_started
      networking-api:
        condition: service_started
      dashboard:
        condition: service_started

  # ── Keepalived (VIP Manager / VRRP) ──────────────────────────────────────────
  # Manages INTERNAL_VIP_ADDRESS on NETWORK_INTERFACE via VRRP.
  # Single-node: always MASTER, VIP permanently assigned.
  # Multi-node:  highest priority node wins; VIP floats on failover.
  #
  # Required env vars:
  #   NETWORK_INTERFACE       — management interface (e.g. enp0s3)
  #   INTERNAL_VIP_ADDRESS    — VIP with prefix (e.g. 192.168.10.100/24)
  #   KEEPALIVED_STATE        — MASTER or BACKUP (default: MASTER)
  #   KEEPALIVED_PRIORITY     — 100 for master, 50 for backup
  #   KEEPALIVED_ROUTER_ID    — unique VRRP router ID (1-255) per cluster
  #   KEEPALIVED_AUTH_PASS    — VRRP authentication passphrase
  keepalived:
    build:
      context: ./services/keepalived
      network: host
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-enp0s3}
      INTERNAL_VIP_ADDRESS: ${INTERNAL_VIP_ADDRESS:-}
      KEEPALIVED_STATE: ${KEEPALIVED_STATE:-MASTER}
      KEEPALIVED_PRIORITY: ${KEEPALIVED_PRIORITY:-100}
      KEEPALIVED_ROUTER_ID: ${KEEPALIVED_ROUTER_ID:-51}
      KEEPALIVED_AUTH_PASS: ${KEEPALIVED_AUTH_PASS:-cloudx01}
      HAPROXY_STATS_PORT: ${HAPROXY_STATS_PORT:-8404}
    depends_on:
      - haproxy

  # ═══════════════════════════════════════════════════════════════════════════════
  # FASE 5: ENTERPRISE OBSERVABILITY & MICROSERVICE BILLING/EVENTS
  # ═══════════════════════════════════════════════════════════════════════════════

  # ── Telemetry API (Metrics Collection & Prometheus Exporter) ──────────────────
  telemetry-api:
    build:
      context: ./services
      dockerfile: telemetry/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8010
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/mini_openstack}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-7}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  # ── Telemetry Worker (libvirt/OVN metrics collector) ──────────────────────────
  telemetry-worker:
    build:
      context: ./services
      dockerfile: telemetry_worker/Dockerfile
      network: host
    privileged: true
    network_mode: host
    environment:
      TELEMETRY_API_URL: http://127.0.0.1:8010
      COMPUTE_API_URL: http://127.0.0.1:8003
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-30}
      LIBVIRT_URI: ${LIBVIRT_URI:-qemu:///system}
      COMPUTE_HOST: ${COMPUTE_HOST:-single-node}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /var/run/openvswitch:/var/run/openvswitch
    depends_on:
      telemetry-api:
        condition: service_started
      compute-api:
        condition: service_started

  # ── Billing API (Resource Usage Billing & Invoicing) ──────────────────────────
  billing-api:
    build:
      context: ./services
      dockerfile: billing/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8011
      BILLING_DATABASE_URL: ${BILLING_DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/cloudx_billing}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      TELEMETRY_API_URL: http://127.0.0.1:8010
      COMPUTE_API_URL: http://127.0.0.1:8003
      BLOCK_STORE_API_URL: http://127.0.0.1:8004
      NETWORKING_API_URL: http://127.0.0.1:8001
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  # ── Billing Worker (Usage Aggregation & Invoice Generator) ────────────────────
  billing-worker:
    build:
      context: ./services
      dockerfile: billing_worker/Dockerfile
      network: host
    environment:
      BILLING_API_URL: http://127.0.0.1:8011
      TELEMETRY_API_URL: http://127.0.0.1:8010
      COMPUTE_API_URL: http://127.0.0.1:8003
      BLOCK_STORE_API_URL: http://127.0.0.1:8004
      NETWORKING_API_URL: http://127.0.0.1:8001
      LOAD_BALANCER_API_URL: http://127.0.0.1:8008
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      AGGREGATION_INTERVAL: ${AGGREGATION_INTERVAL:-3600}
      INVOICE_GENERATION_DAY: ${INVOICE_GENERATION_DAY:-1}
      CLEANUP_DAYS: ${CLEANUP_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    network_mode: host
    depends_on:
      billing-api:
        condition: service_started
      compute-api:
        condition: service_started
      block-store-api:
        condition: service_started

  # ── Event API (Webhook Notification Engine) ───────────────────────────────────
  event-api:
    build:
      context: ./services
      dockerfile: event/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8012
      EVENT_DATABASE_URL: ${EVENT_DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/cloudx_events}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-5}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  # ── Event Worker (Webhook Delivery Engine) ────────────────────────────────────
  event-worker:
    build:
      context: ./services
      dockerfile: event_worker/Dockerfile
      network: host
    environment:
      EVENT_API_URL: http://127.0.0.1:8012
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-5}
      BASE_RETRY_DELAY: ${BASE_RETRY_DELAY:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    network_mode: host
    depends_on:
      event-api:
        condition: service_started

  # ═══════════════════════════════════════════════════════════════════════════════
  # FASE 6: MULTI-NODE COMPUTE & ADVANCED ORCHESTRATION
  # ═══════════════════════════════════════════════════════════════════════════════

  # ── Orchestration API (Auto-Scaling Group Engine) ─────────────────────────────
  orchestration-api:
    build:
      context: ./services
      dockerfile: orchestration/Dockerfile
      network: host
    environment:
      HOST: 127.0.0.1
      PORT: 8013
      ORCHESTRATION_DATABASE_URL: ${ORCHESTRATION_DATABASE_URL:-postgresql+psycopg://mini:mini@127.0.0.1:5432/cloudx_orchestration}
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      COMPUTE_API_URL: http://127.0.0.1:8003
      TELEMETRY_API_URL: http://127.0.0.1:8010
      LOAD_BALANCER_API_URL: http://127.0.0.1:8008
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started

  # ── Orchestration Worker (Auto-Scaling Monitor) ───────────────────────────────
  orchestration-worker:
    build:
      context: ./services
      dockerfile: orchestration_worker/Dockerfile
      network: host
    environment:
      ORCHESTRATION_API_URL: http://127.0.0.1:8013
      COMPUTE_API_URL: http://127.0.0.1:8003
      TELEMETRY_API_URL: http://127.0.0.1:8010
      LOAD_BALANCER_API_URL: http://127.0.0.1:8008
      AUTH_API_URL: http://127.0.0.1:8005
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    network_mode: host
    depends_on:
      orchestration-api:
        condition: service_started
      compute-api:
        condition: service_started
      telemetry-api:
        condition: service_started

  # ── XIDE (Cloud9-style in-browser IDE) ──────────────────────────────────────
  # Single lightweight code-server (VS Code in the browser, MIT license) serving
  # per-user isolated workspaces. Runs host-network and serves its own HTTP+WS
  # natively on :8085 — no reverse-proxy WebSocket bridging needed.
  xide:
    image: codercom/code-server:latest
    restart: unless-stopped
    network_mode: host
    command:
      - /usr/bin/entrypoint.sh
      - --bind-addr
      - 0.0.0.0:8085
      - --auth
      - none
      - --disable-telemetry
      - --disable-update-check
    environment:
      DOCKER_USER: coder
    volumes:
      - xide-workspaces:/home/coder
    depends_on:
      - dashboard

volumes:
  postgres-data:
  ovn-nb-data:
  ovn-sb-data:
  image-data:
  minio-data:
  object-store-data:
  rabbitmq-data:
  xide-workspaces:
