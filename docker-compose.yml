services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_openstack}
      POSTGRES_USER: ${POSTGRES_USER:-mini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini} -d ${POSTGRES_DB:-mini_openstack}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lab-net

  ovn-nb-db:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-ovn-db.sh", "nb"]
    ports:
      - "6641:6641"
    volumes:
      - ovn-nb-data:/var/lib/ovn
    networks:
      - lab-net

  ovn-sb-db:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-ovn-db.sh", "sb"]
    ports:
      - "6642:6642"
    volumes:
      - ovn-sb-data:/var/lib/ovn
    networks:
      - lab-net

  ovn-northd:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-northd.sh"]
    depends_on:
      - ovn-nb-db
      - ovn-sb-db
    environment:
      OVN_NB_DB: tcp:ovn-nb-db:6641
      OVN_SB_DB: tcp:ovn-sb-db:6642
    networks:
      - lab-net

  ovs-ovn-controller:
    build:
      context: ./services/ovn
      network: host
    command: ["/usr/local/bin/start-controller.sh"]
    privileged: true
    network_mode: host
    depends_on:
      - ovn-sb-db
    environment:
      OVN_SB_DB: tcp:127.0.0.1:6642
      OVN_ENCAP_IP: 127.0.0.1
      PROVIDER_BRIDGE: ${PROVIDER_BRIDGE:-br-ex}
      PROVIDER_PHYSNET: ${PROVIDER_PHYSNET:-physnet1}
      PROVIDER_INTERFACE: ${PROVIDER_INTERFACE:-enp0s8}
    volumes:
      - /var/run/openvswitch:/var/run/openvswitch

  # ── Auth API (Keystone-like) ────────────────────────────────────────────────
  auth-api:
    build:
      context: ./services/auth
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@postgres:5432/mini_openstack}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      AUTH_TOKEN_EXPIRE_HOURS: ${AUTH_TOKEN_EXPIRE_HOURS:-24}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-admin@cloudx.local}
      AUTH_ADMIN_PROJECT: ${AUTH_ADMIN_PROJECT:-admin}
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab-net

  networking-api:
    build:
      context: ./services/networking
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@postgres:5432/mini_openstack}
      AUTH_API_URL: http://auth-api:8000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      OVN_NB_DB: tcp:ovn-nb-db:6641
      PROVIDER_INTERFACE: ${PROVIDER_INTERFACE:-enp0s8}
      PROVIDER_BRIDGE: ${PROVIDER_BRIDGE:-br-ex}
      PROVIDER_PHYSNET: ${PROVIDER_PHYSNET:-physnet1}
      PROVIDER_NETWORK_NAME: ${PROVIDER_NETWORK_NAME:-public-net}
      PROVIDER_SUBNET_NAME: ${PROVIDER_SUBNET_NAME:-public-subnet}
      PROVIDER_CIDR: ${PROVIDER_CIDR:-192.168.56.0/24}
      PROVIDER_GATEWAY: ${PROVIDER_GATEWAY:-192.168.56.1}
      PROVIDER_ALLOCATION_START: ${PROVIDER_ALLOCATION_START:-192.168.56.100}
      PROVIDER_ALLOCATION_END: ${PROVIDER_ALLOCATION_END:-192.168.56.200}
      PROVIDER_DNS: ${PROVIDER_DNS:-8.8.8.8}
      PROVIDER_ENABLE_DHCP: ${PROVIDER_ENABLE_DHCP:-false}
      PROVIDER_HOST_IP: ${PROVIDER_HOST_IP:-}
      PROVIDER_NETWORK_AUTO_CREATE: ${PROVIDER_NETWORK_AUTO_CREATE:-false}
      DEFAULT_SECURITY_GROUP_ALLOW_SSH: ${DEFAULT_SECURITY_GROUP_ALLOW_SSH:-true}
      DEFAULT_SECURITY_GROUP_ALLOW_ICMP: ${DEFAULT_SECURITY_GROUP_ALLOW_ICMP:-true}
    ports:
      - "8001:8000"
    volumes:
      - /var/run/openvswitch:/var/run/openvswitch
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
      ovn-nb-db:
        condition: service_started
    networks:
      - lab-net

  image-api:
    build:
      context: ./services/image
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@postgres:5432/mini_openstack}
      AUTH_API_URL: http://auth-api:8000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      IMAGE_STORAGE_BACKEND: ${IMAGE_STORAGE_BACKEND:-file}
      IMAGE_STORE_PATH: ${IMAGE_STORE_PATH:-/var/lib/mini-openstack/images}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-openstack-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    ports:
      - "8002:8000"
    volumes:
      - image-data:/var/lib/mini-openstack/images
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
    networks:
      - lab-net

  metadata-api:
    build:
      context: ./services/metadata
      network: host
    environment:
      COMPUTE_API_URL: http://localhost:8003
      AUTH_API_URL: http://localhost:8005
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
    network_mode: host
    depends_on:
      compute-api:
        condition: service_started

  metadata-proxy:
    build:
      context: ./services/metadata_proxy
      network: host
    environment:
      METADATA_API_URL: ${METADATA_API_URL:-http://127.0.0.1:8775}
      NETWORKING_API_URL: ${NETWORKING_API_URL:-http://127.0.0.1:8001}
      METADATA_PROXY_PORT: ${METADATA_PROXY_PORT:-8776}
    network_mode: host
    depends_on:
      metadata-api:
        condition: service_started
      networking-api:
        condition: service_started

  minio:
    image: minio/minio:latest
    profiles:
      - minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - lab-net

  minio-init:
    image: minio/mc:latest
    profiles:
      - minio
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-openstack-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing local/"$$MINIO_BUCKET"
    networks:
      - lab-net

  compute-api:
    build:
      context: ./services/compute
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@postgres:5432/mini_openstack}
      AUTH_API_URL: http://auth-api:8000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      IMAGE_API_URL: http://image-api:8000
      NETWORKING_API_URL: http://networking-api:8000
      BLOCK_STORE_API_URL: http://block-store-api:8000
      PLACEMENT_API_URL: http://placement-api:8000
      NOVNC_BASE_URL: ${NOVNC_BASE_URL:-http://localhost:6080/vnc.html}
      COMPUTE_BACKEND: ${COMPUTE_BACKEND:-libvirt}
      COMPUTE_WORKER_URL: ${COMPUTE_WORKER_URL:-http://host.docker.internal:8010}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
      image-api:
        condition: service_started
      networking-api:
        condition: service_started
      block-store-api:
        condition: service_started
    networks:
      - lab-net

  compute-worker:
    build:
      context: ./services/compute_worker
      network: host
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      COMPUTE_API_URL: ${COMPUTE_API_URL:-http://127.0.0.1:8003}
      IMAGE_API_URL: ${IMAGE_API_URL:-http://127.0.0.1:8002}
      LIBVIRT_URI: ${LIBVIRT_URI:-qemu:///system}
      COMPUTE_INSTANCE_DIR: ${COMPUTE_INSTANCE_DIR:-/var/lib/mini-openstack/compute/instances}
      COMPUTE_IMAGE_CACHE_DIR: ${COMPUTE_IMAGE_CACHE_DIR:-/var/lib/mini-openstack/compute/cache/images}
      OVS_BRIDGE: ${OVS_BRIDGE:-br-int}
      VM_NAME_PREFIX: ${VM_NAME_PREFIX:-mini-os}
    volumes:
      - ${COMPUTE_INSTANCE_DIR:-/var/lib/mini-openstack/compute/instances}:/var/lib/mini-openstack/compute/instances
      - ${COMPUTE_CACHE_DIR:-/var/lib/mini-openstack/compute/cache}:/var/lib/mini-openstack/compute/cache
      - /dev:/dev                  # LVM: access block devices for volume attach
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
      - /var/run/openvswitch:/var/run/openvswitch
    depends_on:
      image-api:
        condition: service_started
      networking-api:
        condition: service_started

  block-store-api:
    build:
      context: ./services/block_store
      network: host
    privileged: true               # Required for lvcreate / vgcreate / pvcreate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@postgres:5432/mini_openstack}
      AUTH_API_URL: http://auth-api:8000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
      COMPUTE_API_URL: http://compute-api:8000
      IMAGE_API_URL: http://image-api:8000
      # ── Storage drivers ────────────────────────────────────────────────────
      STORAGE_LVM_DRIVER: ${STORAGE_LVM_DRIVER:-true}
      STORAGE_CEPH_RBD_DRIVER: ${STORAGE_CEPH_RBD_DRIVER:-false}
      # ── LVM config (required when STORAGE_LVM_DRIVER=true) ─────────────────
      LVM_PV_NAME: ${LVM_PV_NAME:-}
      LVM_VG_NAME: ${LVM_VG_NAME:-vg-cloudx}
      # ── Ceph config (required when STORAGE_CEPH_RBD_DRIVER=true) ──────────
      CEPH_POOL: ${CEPH_POOL:-}
      CEPH_CONF: ${CEPH_CONF:-/etc/ceph/ceph.conf}
      CEPH_KEYRING: ${CEPH_KEYRING:-}
    ports:
      - "8004:8000"
    volumes:
      - /dev:/dev                  # LVM: access to block devices on host
      - /run/lvm:/run/lvm          # LVM: lock files
      - /etc/ceph:/etc/ceph:ro     # Ceph: config + keyring (optional)
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
      image-api:
        condition: service_started
    networks:
      - lab-net

  # ── Placement API ───────────────────────────────────────────────────────────
  placement-api:
    build:
      context: ./services/placement
      network: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini:mini@postgres:5432/mini_openstack}
      AUTH_API_URL: http://auth-api:8000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-cloudx-secret-key-change-in-production-min32chars!}
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
    networks:
      - lab-net

  # ── Dashboard (React + FastAPI proxy) ───────────────────────────────────────
  dashboard:
    build:
      context: ./services/dashboard
      network: host
    environment:
      AUTH_API_URL: http://auth-api:8000
      COMPUTE_API_URL: http://compute-api:8000
      NETWORKING_API_URL: http://networking-api:8000
      IMAGE_API_URL: http://image-api:8000
      BLOCK_STORE_API_URL: http://block-store-api:8000
      PLACEMENT_API_URL: http://placement-api:8000
    ports:
      - "8080:8000"
    depends_on:
      auth-api:
        condition: service_started
      compute-api:
        condition: service_started
      networking-api:
        condition: service_started
    networks:
      - lab-net

  novnc:
    image: theasp/novnc:latest
    ports:
      - "6080:6080"
    environment:
      DISPLAY_WIDTH: 1280
      DISPLAY_HEIGHT: 720
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge

volumes:
  postgres-data:
  ovn-nb-data:
  ovn-sb-data:
  image-data:
  minio-data:
