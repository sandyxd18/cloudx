# CloudX Prometheus alert rules (Phase 5)
groups:
  - name: cloudx-availability
    rules:
      - alert: CloudXApiDown
        expr: up{job="cloudx-apis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CloudX API target down ({{ $labels.instance }})"
          description: "{{ $labels.instance }} has been unreachable for 2 minutes."

      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter down ({{ $labels.instance }})"

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter down"

      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ down"

  - name: cloudx-performance
    rules:
      - alert: HighApiLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(cloudx_api_request_latency_seconds_bucket[5m])) by (le, service)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency for {{ $labels.service }}"
          description: "P95 request latency > 500ms for 10 minutes."

      - alert: HighApiErrorRate
        expr: |
          sum(rate(cloudx_api_requests_total{status=~"5.."}[5m])) by (service)
          /
          sum(rate(cloudx_api_requests_total[5m])) by (service)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate for {{ $labels.service }}"

  - name: cloudx-replication
    rules:
      - alert: PostgresReplicationLagHigh
        expr: pg_replication_lag_bytes > 1073741824
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag > 1GB"
