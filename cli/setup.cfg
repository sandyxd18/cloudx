[metadata]
name = cloudx
version = 0.7.0
description = Unified CLI for cloudx cloud platform
author = CloudX Team

[options]
packages = find:
python_requires = >=3.10
install_requires =
    click>=8.1
    requests>=2.31
    tabulate>=0.9

[options.entry_points]
console_scripts =
    cloudx = cloudx_cli.main:cli

[options.packages.find]
where = .
